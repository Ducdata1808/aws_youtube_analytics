services:
  # --- AWS Emulator (LocalStack) ---
  localstack:
    image: localstack/localstack:3.8.1
    container_name: localstack
    ports:
      - "4566:4566"            # Edge port cho mọi AWS services
      - "4510-4559:4510-4559"  # Port range cho external services (như Lambda)
    environment:
      - SERVICES=s3,lambda,iam,logs,sts
      - DEBUG=0
      - LAMBDA_EXECUTOR=docker
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - ENFORCE_IAM=true
    volumes:
      # Lưu trữ trạng thái tạm thời của localstack
      - localstack-data:/var/lib/localstack
      # Bắt buộc để Localstack có thể spawn các container chạy code Lambda
      - "/var/run/docker.sock:/var/run/docker.sock"
      # Thư mục chứa các shell script cấu hình tài nguyên khi LocalStack sẵn sàng
      - "./localstack/init:/etc/localstack/init/ready.d"
      # Mount dataset thô để các scripts hoặc Lambda tiện đọc ghi lúc khởi tạo
      - "./data/raw:/data/raw"
      # Mount ClickHouse config để script có thể cập nhật IAM key
      - "./clickhouse/config:/opt/clickhouse-config"
      # Mount code lambda
      - "./lambdas:/opt/lambdas"
    networks:
      - youtube-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Analytical Database (ClickHouse) ---
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "8123:8123"            # HTTP port (Kết nối HTTP / PowerBI)
      - "9000:9000"            # Native TCP port (clickhouse-client)
    volumes:
      # File cấu hình kết nối S3 với LocalStack
      - "./clickhouse/config/s3_storage.xml:/etc/clickhouse-server/config.d/s3_storage.xml"
      # Tự động chạy script tạo schema/bảng khi DB khởi tạo
      - "./clickhouse/init:/docker-entrypoint-initdb.d"
      # Lưu trữ dữ liệu ClickHouse
      - clickhouse-data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_DB=youtube_analytics
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse123
      - CLICKHOUSE_AWS_ACCESS_KEY_ID=${CLICKHOUSE_AWS_ACCESS_KEY_ID}
      - CLICKHOUSE_AWS_SECRET_ACCESS_KEY=${CLICKHOUSE_AWS_SECRET_ACCESS_KEY}
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - youtube-net

  # --- Airflow Metadata Database ---
  postgres:
    image: postgres:13
    container_name: airflow-postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    networks:
      - youtube-net

  # --- Airflow DB Init (Chạy 1 lần để tạo bảng và tài khoản admin) ---
  airflow-init:
    image: apache/airflow:2.7.2-python3.10
    container_name: airflow-init
    depends_on:
      - postgres
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
    command: >
      bash -c "airflow db init && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin"
    networks:
      - youtube-net
    user: "${AIRFLOW_UID:-50000}:0"

  # --- Airflow Webserver (UI Port 8080) ---
  airflow-webserver:
    image: apache/airflow:2.7.2-python3.10
    container_name: airflow-webserver
    depends_on:
      - postgres
      - airflow-init
      - localstack
    environment:
      - LOAD_EX=nym  # Tắt các DAGs mặc định ví dụ của Airflow
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AWS_ENDPOINT_URL=http://localstack:4566
      - LOCALSTACK_ENDPOINT=http://localstack:4566  # Trỏ endpoint upload_to_landing sang container localstack
    command: webserver
    volumes:
      - ./airflow:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./.env:/opt/airflow/.env
      - ./airflow/logs:/opt/airflow/logs  # Mount thư mục log dùng chung
      - ./data:/opt/airflow/data  # Mount data để upload_to_landing có thể đọc dữ liệu thô
    ports:
      - "8080:8080"
    networks:
      - youtube-net
    user: "${AIRFLOW_UID:-50000}:0"

  # --- Airflow Scheduler ---
  airflow-scheduler:
    image: apache/airflow:2.7.2-python3.10
    container_name: airflow-scheduler
    depends_on:
      - postgres
      - airflow-init
      - localstack
    environment:
      - LOAD_EX=nym
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AWS_ENDPOINT_URL=http://localstack:4566
      - LOCALSTACK_ENDPOINT=http://localstack:4566  # Trỏ endpoint upload_to_landing sang container localstack
    command: scheduler
    volumes:
      - ./airflow:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./.env:/opt/airflow/.env
      - ./airflow/logs:/opt/airflow/logs  # Mount thư mục log dùng chung
      - ./data:/opt/airflow/data  # Mount data để upload_to_landing có thể đọc dữ liệu thô
    networks:
      - youtube-net
    user: "${AIRFLOW_UID:-50000}:0"

volumes:
  localstack-data:
  clickhouse-data:
  airflow-db-data:

networks:
  youtube-net:
    driver: bridge
